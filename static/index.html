<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agentic RAG Assistant</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f7f8fa;

            color: #111827;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding: 32px 20px 60px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            margin-bottom: 24px;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 8px;
        }


        .brand-icon {

            width: 34px;

            height: 34px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: 700;
        }


        h1 {

            margin: 0;

            font-size: 25px;

            font-weight: 750;

            letter-spacing: -0.5px;
        }


        .subtitle {

            margin: 0;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================================
           QUESTION CARD
        ========================================= */

        .question-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);
        }


        textarea {

            width: 100%;

            min-height: 120px;

            resize: vertical;

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.6;

            color: #111827;

            background: transparent;
        }


        textarea::placeholder {

            color: #9ca3af;
        }


        .question-footer {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 12px;

            margin-top: 10px;
        }


        .hint {

            margin-right: auto;

            font-size: 12px;

            color: #9ca3af;
        }


        .ask-button {

            border: none;

            background: #111827;

            color: white;

            border-radius: 10px;

            padding: 10px 17px;

            font-size: 13px;

            font-weight: 650;

            cursor: pointer;

            transition: 0.2s;
        }


        .ask-button:hover {

            background: #1f2937;

            transform: translateY(-1px);
        }


        .ask-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           UPLOAD CARD
        ========================================= */

        .upload-card {

            margin-top: 16px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 18px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);
        }


        .upload-header {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;
        }


        .upload-icon {

            width: 34px;

            height: 34px;

            border-radius: 10px;

            border: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;

            color: #374151;

            background: #f9fafb;
        }


        .upload-title {

            font-size: 15px;

            font-weight: 700;
        }


        .upload-subtitle {

            margin-top: 2px;

            font-size: 12px;

            color: #6b7280;
        }


        .upload-area {

            display: block;

            border: 1.5px dashed #d1d5db;

            border-radius: 14px;

            padding: 23px;

            text-align: center;

            cursor: pointer;

            transition: 0.2s;

            background: #fafafa;
        }


        .upload-area:hover {

            border-color: #9ca3af;

            background: #f9fafb;
        }


        .upload-area input {

            display: none;
        }


        .upload-file-icon {

            width: 38px;

            height: 38px;

            margin: 0 auto 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            background: white;

            color: #4b5563;

            font-size: 16px;
        }


        .upload-main {

            font-size: 14px;

            font-weight: 650;

            color: #374151;
        }


        .upload-hint {

            margin-top: 5px;

            font-size: 12px;

            color: #9ca3af;
        }


        .upload-status {

            display: none;

            margin-top: 12px;

            padding: 10px 12px;

            border-radius: 9px;

            font-size: 12px;

            line-height: 1.5;

            background: #f9fafb;

            color: #4b5563;
        }


        .upload-status.success {

            display: block;
        }


        .upload-status.error {

            display: block;

            color: #991b1b;

            background: #fef2f2;

            border: 1px solid #fee2e2;
        }


        /* =========================================
           QUICK QUESTIONS
        ========================================= */

        .quick-section {

            margin-top: 18px;
        }


        .quick-title {

            font-size: 12px;

            font-weight: 650;

            color: #6b7280;

            margin-bottom: 9px;
        }


        .quick-questions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;
        }


        .quick-button {

            border: 1px solid #e5e7eb;

            background: white;

            color: #374151;

            padding: 8px 11px;

            border-radius: 9px;

            font-size: 12px;

            cursor: pointer;

            transition: 0.2s;
        }


        .quick-button:hover {

            background: #f9fafb;

            border-color: #d1d5db;
        }


        /* =========================================
           ANSWER CARD
        ========================================= */

        .answer-card {

            margin-top: 22px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);
        }


        .assistant-header {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;
        }


        .assistant-icon {

            width: 32px;

            height: 32px;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f3f4f6;

            border: 1px solid #e5e7eb;

            font-size: 14px;
        }


        .assistant-name {

            font-size: 14px;

            font-weight: 700;
        }


        .grounded {

            font-size: 11px;

            color: #6b7280;

            margin-top: 2px;
        }


        .answer {

            font-size: 14px;

            line-height: 1.75;

            color: #374151;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* =========================================
           SOURCES
        ========================================= */

        .sources {

            margin-top: 20px;

            padding-top: 16px;

            border-top: 1px solid #f0f0f0;
        }


        .sources-title {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        .source-icon {

            width: 22px;

            height: 22px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 12px;

            color: #4b5563;

            background: #f9fafb;
        }


        .source-list {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .source-card {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 10px 12px;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            background: #fafafa;
        }


        .file-icon {

            width: 28px;

            height: 28px;

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 12px;

            color: #6b7280;

            background: white;
        }


        .source-info {

            min-width: 0;
        }


        .source-name {

            font-size: 13px;

            font-weight: 650;

            color: #111827;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .source-category {

            margin-top: 2px;

            font-size: 11px;

            color: #6b7280;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            display: inline-flex;

            align-items: center;

            gap: 8px;
        }


        .dot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background: #6b7280;

            animation: pulse 1.2s infinite;
        }


        .dot:nth-child(2) {

            animation-delay: 0.2s;
        }


        .dot:nth-child(3) {

            animation-delay: 0.4s;
        }


        @keyframes pulse {

            0%,
            60%,
            100% {

                opacity: 0.3;
            }

            30% {

                opacity: 1;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .container {

                padding:
                    22px 14px 45px;
            }


            h1 {

                font-size: 22px;
            }


            .subtitle {

                font-size: 13px;
            }


            .question-card,
            .upload-card,
            .answer-card {

                border-radius: 15px;
            }


            .question-card {

                padding: 14px;
            }


            textarea {

                min-height: 110px;

                font-size: 14px;
            }


            .question-footer {

                flex-wrap: wrap;
            }


            .hint {

                width: 100%;

                margin-bottom: 3px;
            }


            .ask-button {

                width: 100%;

                padding: 11px;
            }


            .upload-card {

                padding: 14px;
            }


            .upload-area {

                padding: 20px 12px;
            }


            .quick-questions {

                display: grid;

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }


            .quick-button {

                width: 100%;

                text-align: center;
            }


            .answer-card {

                padding: 16px;
            }
        }


        @media (max-width: 380px) {

            .quick-questions {

                grid-template-columns: 1fr;
            }
        }

        /* =========================================
           RESPONSE SECTION SCROLL
        ========================================= */

        #answerCard {
            scroll-margin-top: 30px;
        }
    </style>

</head>


<body>


    <div class="container">


        <!-- =========================================
         HEADER
    ========================================== -->

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <h1>
                    Agentic RAG Assistant
                </h1>

            </div>


            <p class="subtitle">
                Ask questions across your connected knowledge base.
            </p>

        </header>



        <!-- =========================================
         QUESTION
    ========================================== -->

        <div class="question-card">

            <textarea id="question" placeholder="Ask something about your documents..."
                onkeydown="handleKeyDown(event)"></textarea>


            <div class="question-footer">

                <div class="hint">
                    Press Enter to ask · Shift + Enter for a new line
                </div>


                <button class="ask-button" id="askButton" onclick="askQuestion()">
                    Ask Assistant
                </button>

            </div>

        </div>



        <!-- =========================================
         DOCUMENT UPLOAD
    ========================================== -->

        <div class="upload-card">

            <div class="upload-header">

                <div class="upload-icon">
                    ▤
                </div>


                <div>

                    <div class="upload-title">
                        Add Knowledge
                    </div>

                    <div class="upload-subtitle">
                        Upload a document to your knowledge base
                    </div>

                </div>

            </div>


            <label class="upload-area">

                <input
    type="file"
    id="documentInput"
    accept=".txt,.pdf,.docx"
    onchange="uploadDocument()"
>


                <div class="upload-file-icon">
                    ▤
                </div>


                <div class="upload-main">
                    Choose a document
                </div>


                <div class="upload-hint">
                    TXT, PDF and DOCX files supported
                </div>

            </label>


            <div id="uploadStatus" class="upload-status"></div>

        </div>



        <!-- =========================================
         QUICK QUESTIONS
    ========================================== -->

        <div class="quick-section">

            <div class="quick-title">
                Quick questions
            </div>


            <div class="quick-questions">

                <button class="quick-button" onclick="useQuestion('What are the current risks in Project Phoenix?')">
                    Project Risks
                </button>


                <button class="quick-button" onclick="useQuestion('What do you know about Deloitte?')">
                    Deloitte
                </button>
                <button class="quick-button" onclick="useQuestion('What do you know about jobs if IT?')">
                    Software jobs
                </button>


                <button class="quick-button" onclick="useQuestion('What is the largest planet?')">
                    Astronomy
                </button>


                <button class="quick-button" onclick="useQuestion('What technologies are used in the project?')">
                    Technology
                </button>

            </div>

        </div>



        <!-- =========================================
         ANSWER
    ========================================== -->

        <div id="answerCard" class="answer-card" style="display: none;">

            <div class="assistant-header">

                <div class="assistant-icon">
                    ✦
                </div>


                <div>

                    <div class="assistant-name">
                        Assistant
                    </div>

                    <div class="grounded">
                        Grounded response
                    </div>

                </div>

            </div>


            <div class="answer" id="answer"></div>


            <!-- SOURCES -->

            <div class="sources" id="sources" style="display: none;">

                <div class="sources-title">

                    <span class="source-icon">
                        ▤
                    </span>

                    Sources

                </div>


                <div class="source-list" id="sourceList"></div>

            </div>

        </div>


    </div>



    <script>


        // =========================================
        // ENTER KEY HANDLING
        // =========================================

        function handleKeyDown(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                askQuestion();
            }
        }



        // =========================================
        // QUICK QUESTION
        // =========================================

        function useQuestion(question) {

            const textarea =
                document.getElementById("question");

            textarea.value = question;

            textarea.focus();
        }



        // =========================================
        // ASK ASSISTANT
        // =========================================

        async function askQuestion() {

            const textarea =
                document.getElementById("question");

            const question =
                textarea.value.trim();


            if (!question) {

                textarea.focus();

                return;
            }


            const answerCard =
                document.getElementById("answerCard");

            const answer =
                document.getElementById("answer");

            const sources =
                document.getElementById("sources");

            const sourceList =
                document.getElementById("sourceList");

            const askButton =
                document.getElementById("askButton");


            // -----------------------------------------
            // Loading state
            // -----------------------------------------

            askButton.disabled = true;

            askButton.innerText =
                "Thinking...";


            answerCard.style.display =
                "block";

function scrollToAnswer() {
    const answerCard = document.getElementById("answerCard");

    const y =
        answerCard.getBoundingClientRect().top +
        window.pageYOffset -
        (window.innerHeight / 2) +
        (answerCard.offsetHeight / 2);

    window.scrollTo({
        top: Math.max(0, y),
        behavior: "smooth"
    });
}


            sources.style.display =
                "none";


            sourceList.innerHTML =
                "";


            answer.innerHTML = `
            <div class="loading">
                <span>Thinking</span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        `;


            try {

                const response =
                    await fetch(
                        "/ask",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Unable to process the question."
                    );
                }


                // -------------------------------------
                // Answer
                // -------------------------------------

                answer.innerText =
                    data.answer || "No answer returned.";


                answerCard.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });


                // -------------------------------------
                // Sources
                // -------------------------------------

                if (
                    data.sources &&
                    data.sources.length > 0
                ) {

                    sources.style.display =
                        "block";


                    data.sources.forEach(
                        source => {

                            const sourceCard =
                                document.createElement("div");

                            sourceCard.className =
                                "source-card";


                            const fileIcon =
                                document.createElement("div");

                            fileIcon.className =
                                "file-icon";

                            fileIcon.innerText =
                                "▤";


                            const sourceInfo =
                                document.createElement("div");

                            sourceInfo.className =
                                "source-info";


                            const sourceName =
                                document.createElement("div");

                            sourceName.className =
                                "source-name";

                            sourceName.innerText =
                                source.source ||
                                "Unknown document";


                            const sourceCategory =
                                document.createElement("div");

                            sourceCategory.className =
                                "source-category";

                            sourceCategory.innerText =
                                source.category ||
                                "Knowledge Base";


                            sourceInfo.appendChild(
                                sourceName
                            );

                            sourceInfo.appendChild(
                                sourceCategory
                            );


                            sourceCard.appendChild(
                                fileIcon
                            );

                            sourceCard.appendChild(
                                sourceInfo
                            );


                            sourceList.appendChild(
                                sourceCard
                            );

                        }
                    );

                }


            } catch (error) {

                answer.innerText =
                    error.message ||
                    "Something went wrong while processing your question.";

                answerCard.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            } finally {

                askButton.disabled =
                    false;

                askButton.innerText =
                    "Ask Assistant";
            }
        }



        // =========================================
        // DOCUMENT UPLOAD
        // =========================================

        async function uploadDocument() {

            const input =
                document.getElementById(
                    "documentInput"
                );

            const status =
                document.getElementById(
                    "uploadStatus"
                );


            const file =
                input.files[0];


            if (!file) {
                return;
            }


            // -----------------------------------------
            // Validate extension
            // -----------------------------------------

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


const allowedExtensions = [
    "txt",
    "pdf",
    "docx"
];

if (!allowedExtensions.includes(extension)) {

    status.className =
        "upload-status error";

    status.innerText =
        "Supported files: TXT, PDF and DOCX.";

    input.value = "";

    return;
}


            // -----------------------------------------
            // Loading
            // -----------------------------------------

            status.className =
                "upload-status success";

            status.innerText =
                "Uploading and processing document...";


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            try {

                const response =
                    await fetch(
                        "/documents/upload",
                        {

                            method: "POST",

                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Upload failed."
                    );
                }


                status.className =
                    "upload-status success";


                status.innerText =
                    `${data.filename} added successfully. ` +
                    `${data.chunks_stored} chunk(s) stored.`;


                // Clear file selection

                input.value = "";


            } catch (error) {

                status.className =
                    "upload-status error";


                status.innerText =
                    error.message ||
                    "Unable to upload document.";

            }

        }

    </script>


</body>

</html>
