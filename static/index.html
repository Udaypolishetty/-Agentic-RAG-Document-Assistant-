<!DOCTYPE html>
<html>
<head>
    <title>Agentic RAG Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
        }

        button {
            margin-top: 12px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #answer {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Agentic RAG Assistant</h1>

    <p>
        Ask questions about your project knowledge base.
    </p>

    <textarea
        id="question"
        placeholder="Ask something about Project Phoenix..."
    ></textarea>

    <br>

    <button onclick="askQuestion()">
        Ask
    </button>

    <div id="answer">
        Answer will appear here...
    </div>


    <script>

        async function askQuestion() {

            const question =
                document.getElementById("question").value;

            if (!question.trim()) {
                return;
            }

            document.getElementById("answer").innerText =
                "Thinking...";

            const response = await fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            });

            const data = await response.json();

            document.getElementById("answer").innerText =
                data.answer;
        }

    </script>

</body>
</html>
