<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agentic RAG Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f6f7fb;

            color: #171717;
        }


        /* -----------------------------------------
           APP CONTAINER
        ----------------------------------------- */

        .app {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            min-height: 100vh;

            padding: 30px 20px;
        }


        /* -----------------------------------------
           HEADER
        ----------------------------------------- */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .logo {

            width: 52px;

            height: 52px;

            margin: 0 auto 14px;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111827;

            color: white;

            font-size: 24px;

            font-weight: bold;
        }


        h1 {

            margin: 0;

            font-size: 30px;

            letter-spacing: -0.8px;
        }


        .subtitle {

            margin-top: 8px;

            color: #6b7280;

            font-size: 15px;
        }


        /* -----------------------------------------
           QUESTION CARD
        ----------------------------------------- */

        .question-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 18px;

            box-shadow:
                0 8px 30px rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }


        textarea {

            width: 100%;

            min-height: 120px;

            resize: vertical;

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 16px;

            line-height: 1.6;

            color: #111827;

            background: transparent;
        }


        textarea::placeholder {

            color: #9ca3af;
        }


        .ask-row {

            display: flex;

            justify-content: flex-end;

            margin-top: 10px;
        }


        button {

            border: none;

            border-radius: 12px;

            padding: 12px 22px;

            background: #111827;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {

            transform: translateY(-1px);

            opacity: 0.9;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* -----------------------------------------
           QUICK QUESTIONS
        ----------------------------------------- */

        .quick {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 14px;
        }


        .quick button {

            background: white;

            color: #374151;

            border: 1px solid #e5e7eb;

            font-size: 13px;

            padding: 8px 12px;

            font-weight: 500;
        }


        /* -----------------------------------------
           RESPONSE
        ----------------------------------------- */

        .response {

            margin-top: 24px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 8px 30px rgba(
                    0,
                    0,
                    0,
                    0.04
                );

            display: none;
        }


        .response-header {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 18px;
        }


        .assistant-icon {

            width: 34px;

            height: 34px;

            border-radius: 10px;

            background: #111827;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;
        }


        .response-title {

            font-weight: 700;

            font-size: 15px;
        }


        .grounded {

            font-size: 12px;

            color: #6b7280;

            margin-top: 2px;
        }


        .answer {

            font-size: 16px;

            line-height: 1.7;

            white-space: pre-wrap;

            color: #252525;
        }


        /* -----------------------------------------
           SOURCES
        ----------------------------------------- */

        .sources {

            margin-top: 24px;

            padding-top: 18px;

            border-top: 1px solid #eeeeee;
        }


        .sources-title {

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        .source {

            padding: 12px;

            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            margin-bottom: 8px;
        }


        .source-name {

            font-size: 14px;

            font-weight: 600;

            color: #111827;
        }


        .source-category {

            display: inline-block;

            margin-top: 5px;

            font-size: 11px;

            color: #6b7280;

            background: #eef2f7;

            padding: 3px 7px;

            border-radius: 6px;
        }


        .no-source {

            color: #6b7280;

            font-size: 13px;
        }


        /* -----------------------------------------
           LOADING
        ----------------------------------------- */

        .loading {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #6b7280;

            font-size: 14px;
        }


        .dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #6b7280;

            animation: pulse 1s infinite alternate;
        }


        @keyframes pulse {

            from {
                opacity: 0.3;
            }

            to {
                opacity: 1;
            }
        }


        /* -----------------------------------------
           MOBILE
        ----------------------------------------- */

        @media (max-width: 600px) {

            .app {

                padding: 20px 12px;
            }


            h1 {

                font-size: 24px;
            }


            .subtitle {

                font-size: 13px;
            }


            .question-card {

                padding: 14px;

                border-radius: 15px;
            }


            textarea {

                min-height: 110px;

                font-size: 15px;
            }


            .ask-row button {

                width: 100%;
            }


            .quick {

                flex-direction: column;
            }


            .quick button {

                width: 100%;

                text-align: left;
            }


            .response {

                padding: 17px;

                border-radius: 15px;
            }


            .answer {

                font-size: 15px;
            }
            .sources-title {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
}

.source-icon {
    width: 22px;
    height: 22px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #d1d5db;
    border-radius: 6px;

    font-size: 13px;
    color: #4b5563;
    background: #f9fafb;
}
        }

    </style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            ✦
        </div>

        <h1>
            Agentic RAG Assistant
        </h1>

        <div class="subtitle">
            Ask questions across your connected knowledge base
        </div>

    </div>


    <!-- QUESTION -->

    <div class="question-card">

        <textarea
            id="question"
            placeholder="Ask something about your documents..."
        ></textarea>


        <div class="ask-row">

            <button
                id="askButton"
                onclick="askQuestion()"
            >
                Ask Assistant
            </button>

        </div>

    </div>


    <!-- QUICK QUESTIONS -->

    <div class="quick">

        <button
            onclick="setQuestion('What are the current risks in Project Phoenix?')"
        >
            Project Risks
        </button>


        <button
            onclick="setQuestion('What do you know about Deloitte?')"
        >
            Deloitte
        </button>


        <button
            onclick="setQuestion('What is the largest planet?')"
        >
            Astronomy
        </button>


        <button
            onclick="setQuestion('What technologies are used in the project?')"
        >
            Technology
        </button>

    </div>


    <!-- RESPONSE -->

    <div
        id="response"
        class="response"
    >

        <div class="response-header">

            <div class="assistant-icon">
                ✦
            </div>

            <div>

                <div class="response-title">
                    Assistant
                </div>

                <div class="grounded">
                    Grounded response
                </div>

            </div>

        </div>


        <div
            id="answer"
            class="answer"
        ></div>


        <!-- SOURCES -->

        <div class="sources">

<div class="sources-title">
    <span class="source-icon">▤</span>
    Sources
</div>

            <div id="sourcesList"></div>

        </div>

    </div>


</div>


<script>


    // ---------------------------------------------
    // QUICK QUESTION
    // ---------------------------------------------

    function setQuestion(question) {

        document.getElementById(
            "question"
        ).value = question;

        document.getElementById(
            "question"
        ).focus();
    }


    // ---------------------------------------------
    // ASK QUESTION
    // ---------------------------------------------

    async function askQuestion() {

        const question =
            document.getElementById(
                "question"
            ).value.trim();


        if (!question) {

            return;
        }


        const button =
            document.getElementById(
                "askButton"
            );


        const responseBox =
            document.getElementById(
                "response"
            );


        const answerBox =
            document.getElementById(
                "answer"
            );


        const sourcesList =
            document.getElementById(
                "sourcesList"
            );


        // -----------------------------------------
        // Loading state
        // -----------------------------------------

        button.disabled = true;

        button.innerText =
            "Thinking...";


        responseBox.style.display =
            "block";


        answerBox.innerHTML = `
            <div class="loading">
                <span class="dot"></span>
                Searching knowledge base and generating answer...
            </div>
        `;


        sourcesList.innerHTML = "";


        try {

            const response =
                await fetch(
                    "/ask",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to process question."
                );
            }


            // -------------------------------------
            // Answer
            // -------------------------------------

            answerBox.innerText =
                data.answer;


            // -------------------------------------
            // Sources
            // -------------------------------------

            if (
                data.sources &&
                data.sources.length > 0
            ) {

                data.sources.forEach(
                    source => {

                        const sourceDiv =
                            document.createElement(
                                "div"
                            );

                        sourceDiv.className =
                            "source";


                        sourceDiv.innerHTML = `

                            <div class="source-name">
                                ${escapeHtml(
                                    source.source
                                )}
                            </div>

                            <span class="source-category">
                                ${escapeHtml(
                                    source.category
                                )}
                            </span>

                        `;


                        sourcesList.appendChild(
                            sourceDiv
                        );

                    }
                );

            } else {

                sourcesList.innerHTML = `
                    <div class="no-source">
                        No document sources were used.
                    </div>
                `;

            }


        } catch (error) {

            answerBox.innerText =
                "Sorry, something went wrong while processing your question.";


            sourcesList.innerHTML = `
                <div class="no-source">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }


        // -----------------------------------------
        // Reset button
        // -----------------------------------------

        button.disabled = false;

        button.innerText =
            "Ask Assistant";
    }


    // ---------------------------------------------
    // ENTER KEY
    // ---------------------------------------------

    document
        .getElementById("question")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    askQuestion();
                }

            }
        );


    // ---------------------------------------------
    // HTML ESCAPING
    // ---------------------------------------------

    function escapeHtml(value) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            value ?? "";

        return div.innerHTML;
    }

</script>


</body>

</html>
